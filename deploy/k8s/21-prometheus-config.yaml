apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      # 5s: fine enough to see a flash spike develop, and it is the cadence the
      # collector and the forecaster's feature windows assume (CLAUDE.md §3.7).
      scrape_interval: 5s
      scrape_timeout: 3s
      evaluation_interval: 30s

    scrape_configs:

      # ------------------------------------------------------------------
      # 1. Application pods, discovered by annotation.
      #    This is the PRIMARY signal: offered load in requests/sec.
      # ------------------------------------------------------------------
      - job_name: cloudpulse-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [cloudpulse]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # ------------------------------------------------------------------
      # 2. Kubelet cAdvisor, proxied through the API server.
      #    SECONDARY signal: total CPU millicores summed across pods.
      #    Both signals are replica-independent by construction (§3.2).
      # ------------------------------------------------------------------
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        # cAdvisor is extremely high cardinality. Keeping only the four series
        # we actually use (usage, memory, quota, period) in `cloudpulse` ns is
        # what keeps Prometheus lightweight instead of >1Gi while letting
        # deploy/queries.md query #3 (per-pod utilisation) evaluate cleanly.
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: (container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_spec_cpu_quota|container_spec_cpu_period)
          - source_labels: [namespace]
            action: keep
            regex: cloudpulse
          - source_labels: [container]
            action: drop
            regex: ^$
